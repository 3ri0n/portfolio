<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Test</title>
  <link rel="stylesheet" href="minigame.css">
  <script type="module" src="js/typing-test.js"></script>
</head>
<body>
  <div class="topbar">
    <div id="modes">
      <button type="button" class="chip active" data-time="15" aria-pressed="true" disabled>15s</button>
      <button type="button" class="chip" data-time="30" aria-pressed="false" disabled>30s</button>
      <button type="button" class="chip" data-time="60" aria-pressed="false" disabled>60s</button>
    </div>
    <div class="spacer"></div>
    <button type="button" disabled id="newText" class="btn btn-ghost" title="Load new text">New text</button>
    <button type="button" disabled id="restart" class="btn" title="Restart test">Restart</button>
    <button type="button" disabled id="focus" class="btn btn-ghost" title="Focus typing">Focus</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Time</div><div class="value" id="time">15</div></div>
    <div class="stat"><div class="label">WPM</div><div class="value" id="wpm">0</div></div>
    <div class="stat"><div class="label">Accuracy</div><div class="value" id="acc">100%</div></div>
    <div class="stat"><div class="label">Chars</div><div class="value" id="chars">0/0</div></div>
  </div>

  <div class="bar-wrap"><div class="bar" id="bar"></div></div>

  <main class="arena">
    <div class="text-wrap" id="wrap">
      <div class="text" id="text"></div>
      <div class="caret" id="caret" aria-hidden="true" hidden></div>
    </div>
    <input class="typing-input" id="typing-input" aria-label="Typing test input" placeholder="Type the passage here…" maxlength="5000" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
    <p id="status" class="typing-status" role="status">Loading the passage…</p>
  </main>

  <a id="back-glow" href="index.html" aria-label="Back to home" title="Back to home"></a>

</body>
</html>
